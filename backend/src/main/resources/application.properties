server.port=8081
spring.application.name=urban-drainage-portal

# Database Configuration (PostgreSQL default, with H2 in-memory fallback for dev/testing)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:urbandrainage;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (enabled for inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Multipart / File Upload limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
